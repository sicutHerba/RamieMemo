name: Memo Submission

on:
  issues:
    types: [opened, edited, labeled, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # prepare: build (or rebuild) a DRAFT PR for a memo submission.
  #   Triggered by an issue open/edit OR by a maintainer comment of `/regenerate`.
  #   If a draft PR already exists with manual edits, refuses to overwrite
  #   unless explicitly forced via /regenerate.
  # ---------------------------------------------------------------------------
  prepare:
    if: |
      (
        github.event_name == 'issues'
        && (
          github.event.action == 'opened'
          || github.event.action == 'edited'
          || github.event.action == 'reopened'
          || (github.event.action == 'labeled' && github.event.label.name == 'memo-submission')
        )
        && github.event.issue.state == 'open'
        && contains(github.event.issue.labels.*.name, 'memo-submission')
      ) || (
        github.event_name == 'issue_comment'
        && github.event.action == 'created'
        && github.event.issue.pull_request == null
        && github.event.issue.state == 'open'
        && startsWith(github.event.comment.body, '/regenerate')
        && contains(github.event.issue.labels.*.name, 'memo-submission')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify /regenerate sender (if applicable)
        id: mode
        uses: actions/github-script@v7
        with:
          script: |
            const isCmd = context.eventName === 'issue_comment'
              && context.payload.comment
              && context.payload.comment.body.trim().startsWith('/regenerate');
            if (isCmd) {
              const actor = context.payload.comment.user.login;
              const { owner, repo } = context.repo;
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor,
              });
              if (!['admin', 'maintain', 'write'].includes(perm.permission)) {
                core.setFailed(`/regenerate from @${actor} ignored: write access required.`);
                return;
              }
              core.info(`/regenerate accepted from @${actor}`);
            }
            core.setOutput('force', isCmd ? 'true' : 'false');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse issue (dry run)
        id: parse
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue-to-memo.js --dry-run --out-summary preview.md

      - name: Ensure preview file exists
        if: always()
        run: |
          if [ ! -f preview.md ]; then
            cat > preview.md <<'EOF'
          ## 📝 备忘录提交预览 / Memo Submission Preview

          😅 抱歉，机器人在解析这个 Issue 时崩溃了，没能给出预览。
          这通常是 Issue 正文格式不匹配「提交新备忘录」模板导致的。
          请使用模板：👉 **[使用「提交新备忘录」模板](../../issues/new?template=new-memo.yml)**

          ---

          😅 Sorry — the bot crashed while parsing this issue and couldn't produce a preview.
          Please use the template: 👉 **[Open a new memo with the template](../../issues/new?template=new-memo.yml)**
          EOF
          fi

      - name: Look up existing draft PR
        id: pr_lookup
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          # Use a PAT/App token when available so the PR open/sync events
          # trigger downstream workflows (e.g. deploy.yml PR checks).
          # Falls back to GITHUB_TOKEN (no workflow-trigger) if not set.
          github-token: ${{ secrets.MEMO_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const branch = `memo/issue-${process.env.ISSUE_NUMBER}`;
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branch}`, state: 'open',
            });
            const pr = prs[0];
            let hasManualEdits = false;
            if (pr) {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              hasManualEdits = commits.some(c => {
                const email = c.commit && c.commit.author && c.commit.author.email;
                return email && email !== 'ramie-memo-bot@users.noreply.github.com';
              });
            }
            core.setOutput('branch', branch);
            core.setOutput('pr_number', pr ? String(pr.number) : '');
            core.setOutput('pr_url', pr ? pr.html_url : '');
            core.setOutput('has_manual_edits', hasManualEdits ? 'true' : 'false');

      - name: Decide next action
        id: action
        env:
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          HAS_MANUAL_EDITS: ${{ steps.pr_lookup.outputs.has_manual_edits }}
          PR_NUMBER: ${{ steps.pr_lookup.outputs.pr_number }}
          FORCE: ${{ steps.mode.outputs.force }}
        run: |
          set -eu
          if [ "$PARSE_OUTCOME" != "success" ]; then
            NEXT=skip-parse-failed
          elif [ -n "$PR_NUMBER" ] && [ "$HAS_MANUAL_EDITS" = "true" ] && [ "$FORCE" != "true" ]; then
            NEXT=skip-manual-edits
          else
            NEXT=build
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Decided: next=$NEXT"

      - name: Generate, enrich, localize, validate, index, push
        if: steps.action.outputs.next == 'build'
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.pr_lookup.outputs.branch }}
          # Prefer a bot PAT so the branch push (PR synchronize) triggers
          # downstream workflows. Falls back to GITHUB_TOKEN.
          PUSH_TOKEN: ${{ secrets.MEMO_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Generate the memo file from the issue body.
          node scripts/issue-to-memo.js --out-summary preview.md | tee memo-output.txt
          {
            grep '^memo_id='       memo-output.txt
            grep '^memo_folder='   memo-output.txt
            grep '^memo_file='     memo-output.txt
            grep '^memo_type='     memo-output.txt
            grep '^memo_title_zh=' memo-output.txt
          } >> "$GITHUB_OUTPUT"
          MEMO_FILE=$(grep '^memo_file=' memo-output.txt | cut -d= -f2-)
          MEMO_ID=$(grep '^memo_id=' memo-output.txt | cut -d= -f2-)

          # 2. Enrich URL-only sources with their real <title>.
          node scripts/fetch-source-titles.js "$MEMO_FILE"

          # 3. Download remote images (SSRF-safe) and rewrite to local paths.
          node scripts/localize-images.js "$MEMO_FILE"

          # 4. Validate the data.
          npm run validate

          # 5. Rebuild the index.
          npm run build-index

          # 6. Commit and force-push to a stable per-issue branch.
          git config user.name "ramie-memo-bot"
          git config user.email "ramie-memo-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/data/memos public/images/memos
          if git diff --cached --quiet; then
            echo "No changes to commit (memo identical to existing branch)."
          else
            git commit -m "feat(memo): add ${MEMO_ID} (from issue #${ISSUE_NUMBER})"
          fi
          # Authenticate the push with PUSH_TOKEN so PR synchronize events fire
          # downstream workflows (only effective when MEMO_BOT_TOKEN is set).
          git push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"

      - name: Open or update draft PR
        if: steps.action.outputs.next == 'build'
        id: pr
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.pr_lookup.outputs.branch }}
          EXISTING_PR: ${{ steps.pr_lookup.outputs.pr_number }}
          MEMO_ID: ${{ steps.build.outputs.memo_id }}
          MEMO_FILE: ${{ steps.build.outputs.memo_file }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          # See note on pr_lookup: a bot PAT makes the PR open event trigger
          # deploy.yml's PR checks (test → validate → build).
          github-token: ${{ secrets.MEMO_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const preview = fs.existsSync('preview.md') ? fs.readFileSync('preview.md', 'utf8') : '';
            const body = [
              `Closes #${issueNumber}`,
              '',
              `Auto-generated from issue submission. Adds memo \`${process.env.MEMO_ID}\` at \`${process.env.MEMO_FILE}\` and rebuilds \`index.json\`.`,
              '',
              `**Maintainers**: review the diff, edit any file in this PR directly if needed, then click **Merge** when ready. The bot will **not** overwrite manual edits on this PR unless someone comments \`/regenerate\` on the original issue.`,
              '',
              `**Deployment flow**: approve → wait for PR checks (\`test\` → \`validate\` → \`build\`) → merge → deploy. The same checks run again on \`main\` before publishing to GitHub Pages.`,
              '',
              preview,
            ].join('\n');
            const title = `feat(memo): add ${process.env.MEMO_ID} (from issue #${issueNumber})`;
            let pr;
            if (process.env.EXISTING_PR) {
              const { data: updated } = await github.rest.pulls.update({
                owner, repo, pull_number: Number(process.env.EXISTING_PR), title, body,
              });
              pr = updated;
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner, repo, head: process.env.BRANCH, base: 'main',
                title, body, maintainer_can_modify: true,
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: created.number,
                labels: ['memo-submission', 'auto-generated'],
              });
              pr = created;
            }
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_url', pr.html_url);

      - name: Rename issue title if still default
        if: steps.action.outputs.next == 'build'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MEMO_TITLE_ZH: ${{ steps.build.outputs.memo_title_zh }}
        with:
          script: |
            const issue = context.payload.issue;
            const t = process.env.MEMO_TITLE_ZH;
            if (!t) return;
            const isDefault = !issue.title
              || issue.title === '[Memo] 新条目 / new entry'
              || /^\[Memo\]\s*$/.test(issue.title);
            if (!isDefault) return;
            const { owner, repo } = context.repo;
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, title: `[Memo] ${t}`,
            });

      - name: Post or update sticky status comment
        if: always()
        uses: actions/github-script@v7
        env:
          NEXT: ${{ steps.action.outputs.next }}
          PR_URL: ${{ steps.pr.outputs.pr_url || steps.pr_lookup.outputs.pr_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- memo-preview-bot -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const next = process.env.NEXT;
            const prUrl = process.env.PR_URL;
            let body;
            if (next === 'skip-parse-failed' || !next) {
              const preview = fs.existsSync('preview.md') ? fs.readFileSync('preview.md', 'utf8') : '';
              body = preview + '\n\n_修好后编辑此 Issue（右上角 `···` → Edit），机器人会自动重新校验。_\n_After fixing, edit the issue and the bot will re-check automatically._';
            } else if (next === 'skip-manual-edits') {
              body = [
                '⚠️ 已检测到 PR 中有人工修改，本次不会自动覆盖。',
                '',
                `- 保留 PR 上的修改 → 直接到 ${prUrl} 审核后 Merge 即可。`,
                `- 用 Issue 最新内容**重新生成** → 评论 \`/regenerate\`，会覆盖 PR 上的修改。`,
                '',
                '---',
                '',
                '⚠️ Manual edits detected on the PR — skipping auto-overwrite.',
                '',
                `- Keep current edits → review and merge ${prUrl} directly.`,
                `- Rebuild from latest issue body → comment \`/regenerate\` here (overwrites manual edits).`,
              ].join('\n');
            } else if (next === 'build' && !prUrl) {
              body = [
                '⚠️ 解析成功但后续步骤失败（如生成/推送/PR 开启）。',
                '详情请查看 Actions 运行结果；修复后重新编辑本 Issue 即可重试。',
                '',
                '---',
                '',
                '⚠️ Parsing succeeded but a later step failed (generate / push / open PR).',
                'See the Actions tab for details; editing this issue again will retry.',
              ].join('\n');
            } else {
              body = [
                `✅ PR 已就绪：${prUrl}`,
                '',
                '在 PR 的 *Files changed* 里查看生成的 JSON、下载下来的图片和 `index.json` 变化。需要调整直接在 PR 上改，满意后点 **Merge**。',
                '完整流程：**审核 → 等 PR 检查通过 (`test` / `validate` / `build`) → Merge → 自动部署。**',
                '想让机器人根据本 Issue 最新内容重新生成 PR（会覆盖 PR 上的人工修改），评论 `/regenerate`。',
                '',
                '---',
                '',
                `✅ PR ready: ${prUrl}`,
                '',
                'Review the generated JSON, downloaded images, and `index.json` diff in the *Files changed* tab. Edit the PR directly if anything needs tweaking, then click **Merge**.',
                'Full flow: **approve → wait for PR checks (`test` / `validate` / `build`) → Merge → deploy.**',
                'To rebuild the PR from the latest issue body (overwriting any manual edits on the PR), comment `/regenerate` here.',
              ].join('\n');
            }
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }
